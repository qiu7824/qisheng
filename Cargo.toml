[package]
name = "lx-gpui-player"
version = "0.3.0-alpha.20"
edition = "2024"
license = "Apache-2.0"
description = "A native ZSUI music player with a bounded LX custom-source runtime"

[features]
default = ["desktop"]
desktop = ["dep:zsui"]
smoke = ["desktop", "zsui/native-smoke"]
ui = ["dep:gpui-kit", "dep:rfd", "dep:smol"]

[[bin]]
name = "lx-native"
path = "src/desktop/main.rs"
required-features = ["desktop"]

[[bin]]
name = "lx-gpui-player"
path = "src/main.rs"
required-features = ["ui"]

[[bin]]
name = "lx-native-cli"
path = "src/bin/lx-native-cli.rs"

[[test]]
name = "ui"
path = "tests/ui.rs"
required-features = ["ui"]

[dependencies]
anyhow = "1"
rustfft = "=6.4.1"
gpui-kit = { version = "=0.7.0", features = ["test-support"], optional = true }
boa_engine = { version = "=0.22.0", default-features = false }
html5ever = "=0.27.0"
ryu-js = "=1.0.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
hyper = { version = "=1.11.1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "tls12", "ring", "webpki-tokio"] }
http-body-util = "=0.1.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.9"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "macros"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake", "__rustls-tls"] }
tokio-rustls = { version = "=0.26.6", default-features = false }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std", "async-await"] }
aes = "0.8.4"
md-5 = "0.10.6"
flate2 = "1"
base64 = "0.22"
getrandom = "0.3"
rfd = { version = "0.15", optional = true }
zsui = { path = "vendor/zsui", optional = true, default-features = false, features = ["window", "label", "button", "textbox", "scroll", "canvas", "menu-flyout", "context-menu", "shortcuts", "window-chrome", "grid", "tray", "tooltip", "shell-integration"] }
smol = { version = "2", optional = true }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup"] }
lofty = { version = "=0.25.4", default-features = false, features = ["id3v2_compression_support"] }
encoding_rs = "=0.8.42"
sha1 = "=0.10.6"
regex = "=1.13.1"
num-bigint = "=0.4.8"
roxmltree = "=0.21.1"
rsa = { version = "=0.9.10", features = ["hazmat"] }
icu_collator = "=2.3.0"
icu_locale_core = "=2.3.0"
cpal = "=0.17.3"
rtrb = "=0.4.0"
symphonia = { version = "=0.5.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Foundation", "Media", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Power", "Win32_System_Registry", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[target.'cfg(target_os = "macos")'.dependencies]
notify = "=7.0.0"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "=3.0.12"

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"

[profile.dev]
debug = 0
incremental = false

# Performance and memory regression limits exercise optimized application code
# while preserving assertions, checked arithmetic and isolated test workers.
[profile.test]
opt-level = 1
debug = 0
debug-assertions = true
overflow-checks = true
incremental = false

# Image and authority digests process large byte streams in development too.
# Optimize the hashing implementation while retaining development assertions.
[profile.dev.package."sha2:0.10.9"]
opt-level = 3

[profile.test.package."sha2:0.10.9"]
opt-level = 3
