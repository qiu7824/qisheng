name: Desktop validation and packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platforms to validate
        type: choice
        options: [all, windows, macos, linux]
        default: all
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - id: select
        env:
          SELECTED_PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import json, os
          targets = [
              dict(os='windows', runner='windows-2025', target='x86_64-pc-windows-msvc', label='Windows-x64', jobs=2),
              dict(os='macos', runner='macos-15', target='aarch64-apple-darwin', label='macOS-arm64', jobs=2),
              dict(os='macos', runner='macos-15-intel', target='x86_64-apple-darwin', label='macOS-x64', jobs=2),
              dict(os='linux', runner='ubuntu-24.04', target='x86_64-unknown-linux-gnu', label='Linux-x64', jobs=2),
          ]
          selected = os.environ['SELECTED_PLATFORM']
          targets = [row for row in targets if selected == 'all' or row['os'] == selected]
          assert targets, 'No supported target selected'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('targets=' + json.dumps({'include': targets}) + '\n')
          PY

  desktop:
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_BACKTRACE: '1'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      QISHENG_TARGET: ${{ matrix.target }}
      QISHENG_LABEL: ${{ matrix.label }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Prepare isolated output and test directories
        id: prepare
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'qisheng-ci'
          for name in ['evidence', 'packages', 'temp']:
              (root / name).mkdir(parents=True, exist_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'QISHENG_CI_ROOT={root}\n')
              output.write(f'CARGO_TARGET_DIR={Path(os.environ["RUNNER_TEMP"]) / "qisheng-target"}\n')
              for key in ['TMP', 'TEMP', 'TMPDIR']:
                  output.write(f'{key}={root / "temp"}\n')
          PY

      - name: Linux native dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libasound2-dev libcairo2-dev libpango1.0-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxfixes-dev libegl1-mesa-dev libgl1-mesa-dev fonts-noto-cjk xvfb xauth dbus-x11 zenity openbox openbox openbox

      - name: Rust toolchain and native target identity
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.99.0
          rustc -vV | tee "$QISHENG_CI_ROOT/evidence/toolchain.txt"
          python - <<'PY'
          import os, subprocess
          host = next(line.removeprefix('host: ') for line in subprocess.check_output(['rustc', '-vV'], text=True).splitlines() if line.startswith('host: '))
          assert host == os.environ['QISHENG_TARGET'], (host, os.environ['QISHENG_TARGET'])
          PY

      - name: Reuse dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: qisheng-deps-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: qisheng-deps-${{ matrix.target }}-

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Restore compatible native build cache
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/qisheng-target
          key: qisheng-native-${{ matrix.target }}-rust-1.99.0-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}
          restore-keys: qisheng-native-${{ matrix.target }}-rust-1.99.0-

      - name: Native compilation of every test target
        run: |
          set -o pipefail
          cargo check --locked --all-targets 2>&1 | tee "$QISHENG_CI_ROOT/evidence/check.log"

      - name: Per-profile native launch forwarding
        run: |
          set -o pipefail
          cargo test --locked --bin lx-native instance:: -- --test-threads=1 2>&1 | tee "$QISHENG_CI_ROOT/evidence/tests-instance.log"

      - name: Build process-worker executable for tests
        run: |
          set -o pipefail
          cargo build --locked --profile test --bin lx-native-cli 2>&1 | tee "$QISHENG_CI_ROOT/evidence/worker-build.log"

      - name: Core library tests
        run: |
          set -o pipefail
          cargo test --locked --lib -- --test-threads=1 2>&1 | tee "$QISHENG_CI_ROOT/evidence/tests-core.log"

      - name: Application and integration tests
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          metadata = json.loads(subprocess.check_output(['cargo', 'metadata', '--locked', '--no-deps', '--format-version', '1'], text=True))
          package = next(item for item in metadata['packages'] if item['name'] == 'lx-gpui-player')
          enabled = {'default'}
          pending = ['default']
          while pending:
              for feature in package['features'].get(pending.pop(), []):
                  if feature in package['features'] and feature not in enabled:
                      enabled.add(feature)
                      pending.append(feature)
          selected = []
          optional = []
          for target in package['targets']:
              if 'test' not in target['kind']:
                  continue
              missing = set(target.get('required-features', [])) - enabled
              if missing:
                  optional.append(dict(name=target['name'], requiredFeatures=sorted(missing)))
              else:
                  selected.append(target['name'])
          assert selected, 'No integration test targets were discovered'
          root = Path(os.environ['QISHENG_CI_ROOT'])
          (root / 'evidence' / 'test-targets.json').write_text(json.dumps(dict(features=sorted(enabled), integrationTargets=selected, disabledOptionalTargets=optional), indent=2), encoding='utf-8')
          command = ['cargo', 'test', '--locked', '--bins']
          for name in selected:
              command.extend(['--test', name])
          command.extend(['--', '--test-threads=1'])
          with (root / 'evidence' / 'tests-applications.log').open('w', encoding='utf-8') as log:
              process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, encoding='utf-8', errors='replace')
              for line in process.stdout:
                  print(line, end='', flush=True)
                  log.write(line)
                  log.flush()
              code = process.wait()
          raise SystemExit(code)
          PY

      - name: Build native window smoke executable
        run: |
          set -o pipefail
          cargo build --locked --release --features smoke --bin lx-native 2>&1 | tee "$QISHENG_CI_ROOT/evidence/smoke-build.log"

      - name: Real native window and isolated profile smoke
        run: |
          python - <<'PY'
          import os, platform, subprocess
          from pathlib import Path
          root = Path(os.environ['QISHENG_CI_ROOT'])
          script = root / 'temp' / 'native-smoke.py'
          script.write_text(r'''import json, os, platform, sqlite3, subprocess, time, wave
          from pathlib import Path
          root = Path(os.environ['QISHENG_CI_ROOT'])
          executable = Path(os.environ['CARGO_TARGET_DIR']) / 'release' / ('lx-native.exe' if os.name == 'nt' else 'lx-native')
          evidence = root / 'evidence'
          profile = root / 'temp' / '窗口恢复 中文配置'
          screenshot = evidence / 'native-window.png'
          fixture = root / 'temp' / '导入测试 含空格.wav'
          with wave.open(str(fixture), 'wb') as audio:
              audio.setnchannels(1)
              audio.setsampwidth(2)
              audio.setframerate(44100)
              audio.writeframes(b'\0\0' * 44100)
          manager = None
          primary = None
          with (evidence / 'window-manager.log').open('wb') as manager_log, (evidence / 'native-window.log').open('wb') as log:
              try:
                  if platform.system() == 'Linux':
                      manager = subprocess.Popen(['openbox', '--sm-disable'], stdout=manager_log, stderr=subprocess.STDOUT)
                      time.sleep(1)
                      assert manager.poll() is None, 'Window manager did not start'
                  command = [str(executable), '--data-dir', str(profile), '--audio', 'memory', '--instance-smoke', '--smoke-close', '--smoke', str(screenshot), '--smoke-ms', '8000']
                  if platform.system() == 'Darwin':
                      os.environ['ZSUI_NATIVE_OWNER_FILE_DIALOG_PROOF_DIR'] = str(evidence)
                      command.append('--smoke-pickers')
                  primary = subprocess.Popen(command, stdout=log, stderr=subprocess.STDOUT)
                  deadline = time.monotonic() + 6
                  while not screenshot.with_suffix('.closed.json').is_file():
                      assert primary.poll() is None, 'Primary window exited before launch forwarding'
                      assert time.monotonic() < deadline, 'Native close was not acknowledged'
                      time.sleep(0.05)
                  forwarded = subprocess.run([str(executable), '--data-dir', str(profile), '--audio', 'memory', str(fixture)], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=20)
                  (evidence / 'second-launch.log').write_bytes(forwarded.stdout)
                  assert forwarded.returncode == 0, forwarded.stdout.decode(errors='replace')[-3000:]
                  assert primary.wait(timeout=90) == 0, 'Native window failed; see native-window.log'
              finally:
                  for process in [primary, manager]:
                      if process is not None and process.poll() is None:
                          process.terminate()
                          try:
                              process.wait(timeout=5)
                          except subprocess.TimeoutExpired:
                              process.kill()
                              process.wait()
          assert screenshot.exists() and screenshot.stat().st_size > 1024, 'Native screenshot missing'
          interaction = json.loads(screenshot.with_suffix('.interaction.json').read_text(encoding='utf-8'))
          assert interaction['relaunches_handled'] > 0, 'Second launch did not reach the UI thread'
          assert interaction['background_closes'] > 0, 'Native background close did not retain the window'
          database = profile / 'native-library.sqlite3'
          assert database.is_file(), 'Profile database was not created'
          with sqlite3.connect(database.as_uri() + '?mode=ro', uri=True) as connection:
              count = connection.execute('SELECT count(*) FROM local_assets').fetchone()[0]
          assert count == 1, ('Forwarded file was not imported', count)
          if platform.system() == 'Darwin':
              for name in ['notepad-owner-open-panel.png', 'folder-owner-panel.png']:
                  assert (evidence / name).is_file() and (evidence / name).stat().st_size > 1024, ('Native picker screenshot missing', name)
          (evidence / 'native-smoke-result.json').write_text(json.dumps(dict(window='passed', backgroundClose='passed', secondLaunch='passed', unicodeFileImport='passed', importedAssets=count), indent=2), encoding='utf-8')
          ''', encoding='utf-8')
          command = ['python', str(script)]
          if platform.system() == 'Linux':
              command = ['dbus-run-session', '--', 'xvfb-run', '-a', '-s', '-screen 0 1440x1000x24'] + command
          subprocess.run(command, check=True, timeout=130)
          PY

      - name: Build production executables
        run: |
          set -o pipefail
          cargo build --locked --release --bin lx-native --bin lx-native-cli 2>&1 | tee "$QISHENG_CI_ROOT/evidence/release-build.log"

      - name: Package native applications
        run: |
          python - <<'PY'
          import hashlib, json, os, platform, plistlib, shutil, subprocess, tarfile, tomllib, zipfile
          from pathlib import Path
          source = Path.cwd()
          root = Path(os.environ['QISHENG_CI_ROOT'])
          binaries = Path(os.environ['CARGO_TARGET_DIR']) / 'release'
          version = tomllib.loads((source / 'Cargo.toml').read_text(encoding='utf-8'))['package']['version']
          name = 'Qisheng-' + version + '-' + os.environ['QISHENG_LABEL']
          staging = root / 'temp' / name
          staging.mkdir()
          system = platform.system()
          if system == 'Darwin':
              bundle = staging / '栖声.app'
              contents = bundle / 'Contents'
              executables = contents / 'MacOS'
              resources = contents / 'Resources'
              executables.mkdir(parents=True)
              resources.mkdir()
              app = executables / 'qisheng'
              cli = executables / 'qisheng-cli'
              with (contents / 'Info.plist').open('wb') as output:
                  plistlib.dump(dict(CFBundleIdentifier='com.qisheng.desktop', CFBundleName='栖声', CFBundleDisplayName='栖声', CFBundleExecutable='qisheng', CFBundleIconFile='AppIcon', CFBundlePackageType='APPL', CFBundleShortVersionString=version.split('-')[0], CFBundleVersion=os.environ['GITHUB_RUN_NUMBER'], LSMinimumSystemVersion='15.0', NSHighResolutionCapable=True, NSPrincipalClass='NSApplication'), output)
              iconset = root / 'temp' / 'AppIcon.iconset'
              iconset.mkdir()
              for points in [16, 32, 128, 256, 512]:
                  for scale in [1, 2]:
                      output = iconset / ('icon_' + str(points) + 'x' + str(points) + ('@2x' if scale == 2 else '') + '.png')
                      subprocess.run(['sips', '-z', str(points * scale), str(points * scale), str(source / 'assets/lx-native.png'), '--out', str(output)], check=True, stdout=subprocess.DEVNULL)
              subprocess.run(['iconutil', '-c', 'icns', str(iconset), '-o', str(resources / 'AppIcon.icns')], check=True)
          else:
              app = staging / ('栖声.exe' if system == 'Windows' else 'qisheng')
              cli = staging / ('qisheng-cli.exe' if system == 'Windows' else 'qisheng-cli')
          suffix = '.exe' if system == 'Windows' else ''
          shutil.copy2(binaries / ('lx-native' + suffix), app)
          shutil.copy2(binaries / ('lx-native-cli' + suffix), cli)
          if system != 'Windows':
              app.chmod(0o755)
              cli.chmod(0o755)
          for document in ['LICENSE', 'NOTICE']:
              shutil.copy2(source / document, staging / document)
          shutil.copytree(source / 'licenses', staging / 'licenses')
          if system == 'Windows':
              vswhere = Path(os.environ['ProgramFiles(x86)']) / 'Microsoft Visual Studio/Installer/vswhere.exe'
              installation = subprocess.check_output([str(vswhere), '-latest', '-products', '*', '-requires', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64', '-property', 'installationPath'], text=True).strip()
              candidates = sorted((Path(installation) / 'VC/Redist/MSVC').glob('*/x64/Microsoft.VC*.CRT/vcruntime140.dll'))
              assert candidates, 'MSVC runtime not located'
              for dll in candidates[-1].parent.glob('vcruntime140*.dll'):
                  shutil.copy2(dll, staging / dll.name)
          elif system == 'Darwin':
              subprocess.run(['codesign', '--force', '--sign', '-', str(cli)], check=True)
              subprocess.run(['codesign', '--force', '--sign', '-', str(app)], check=True)
              subprocess.run(['codesign', '--force', '--sign', '-', str(bundle)], check=True)
              subprocess.run(['codesign', '--verify', '--deep', '--strict', str(bundle)], check=True)
          else:
              shutil.copy2(source / 'assets/lx-native.png', staging / 'qisheng.png')
              (staging / 'qisheng.desktop').write_text('[Desktop Entry]\nType=Application\nName=栖声\nExec=qisheng %F\nIcon=qisheng\nTerminal=false\nCategories=AudioVideo;Audio;Player;\nMimeType=audio/mpeg;audio/flac;audio/ogg;audio/x-wav;\n', encoding='utf-8')
              linked = subprocess.check_output(['ldd', str(app)], text=True)
              (root / 'evidence' / 'linux-runtime-libraries.txt').write_text(linked, encoding='utf-8')
              assert 'not found' not in linked, 'A Linux runtime library is missing'
          result = subprocess.run([str(cli), '--data-dir', str(root / 'temp' / 'package-profile'), 'status'], capture_output=True, timeout=45)
          (root / 'evidence' / 'packaged-cli.log').write_bytes(result.stdout + result.stderr)
          assert result.returncode == 0, result.stderr.decode(errors='replace')[-3000:]
          facts = dict(version=version, target=os.environ['QISHENG_TARGET'], commit=os.environ['GITHUB_SHA'], workflowRun=os.environ['GITHUB_RUN_ID'], automatedTests='passed', nativeWindow='passed', audioVerification='memory rendering; physical output requires hardware validation', signing='ad-hoc; no Apple notarization' if system == 'Darwin' else 'unsigned')
          (staging / 'BUILD.json').write_text(json.dumps(facts, ensure_ascii=False, indent=2), encoding='utf-8')
          files = sorted(path for path in staging.rglob('*') if path.is_file())
          (staging / 'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.relative_to(staging).as_posix() + '\n' for path in files), encoding='utf-8')
          packages = root / 'packages'
          if system == 'Darwin':
              subprocess.run(['ditto', '-c', '-k', '--sequesterRsrc', '--keepParent', str(staging), str(packages / (name + '.zip'))], check=True)
              subprocess.run(['hdiutil', 'create', '-volname', '栖声', '-srcfolder', str(staging), '-ov', '-format', 'UDZO', str(packages / (name + '.dmg'))], check=True)
          elif system == 'Windows':
              with zipfile.ZipFile(packages / (name + '.zip'), 'w', zipfile.ZIP_DEFLATED) as archive:
                  for path in staging.rglob('*'):
                      if path.is_file():
                          archive.write(path, path.relative_to(staging.parent).as_posix())
          else:
              with tarfile.open(packages / (name + '.tar.gz'), 'w:gz') as archive:
                  archive.add(staging, arcname=name)
              deb = root / 'temp' / 'debian-package'
              (deb / 'DEBIAN').mkdir(parents=True)
              shutil.copytree(staging, deb / 'usr/lib/qisheng')
              (deb / 'usr/bin').mkdir(parents=True)
              (deb / 'usr/bin/qisheng').symlink_to('../lib/qisheng/qisheng')
              (deb / 'usr/bin/qisheng-cli').symlink_to('../lib/qisheng/qisheng-cli')
              (deb / 'usr/share/applications').mkdir(parents=True)
              shutil.copy2(staging / 'qisheng.desktop', deb / 'usr/share/applications/qisheng.desktop')
              icons = deb / 'usr/share/icons/hicolor/scalable/apps'
              icons.mkdir(parents=True)
              shutil.copy2(source / 'assets/qisheng.svg', icons / 'qisheng.svg')
              depends = 'libc6, libasound2t64, libcairo2, libpango-1.0-0, libpangocairo-1.0-0, libfontconfig1, libxkbcommon0, libwayland-client0, libx11-6, libxcursor1, libxi6, libxrandr2, libxfixes3, libxext6, libgl1, libegl1, fonts-noto-cjk, xdg-desktop-portal, xdg-desktop-portal-gtk | xdg-desktop-portal-kde, zenity'
              (deb / 'DEBIAN/control').write_text('Package: qisheng\nVersion: ' + version.replace('-', '~', 1) + '\nArchitecture: amd64\nMaintainer: Qisheng <30194382+qiu7824@users.noreply.github.com>\nSection: sound\nPriority: optional\nDepends: ' + depends + '\nDescription: Qisheng native desktop music player\n Native music library, playback and synchronized lyrics.\n', encoding='utf-8')
              debfile = packages / (name + '.deb')
              subprocess.run(['dpkg-deb', '--root-owner-group', '--build', str(deb), str(debfile)], check=True)
              subprocess.run(['dpkg-deb', '--info', str(debfile)], check=True)
          unpacked = root / 'temp' / 'archive-verification'
          unpacked.mkdir()
          candidates = []
          if system == 'Darwin':
              subprocess.run(['ditto', '-x', '-k', str(packages / (name + '.zip')), str(unpacked)], check=True)
              subprocess.run(['hdiutil', 'verify', str(packages / (name + '.dmg'))], check=True)
              subprocess.run(['codesign', '--verify', '--deep', '--strict', str(unpacked / name / '栖声.app')], check=True)
              candidates.append((unpacked / name, Path('栖声.app/Contents/MacOS/qisheng-cli')))
          elif system == 'Windows':
              with zipfile.ZipFile(packages / (name + '.zip')) as archive:
                  assert archive.testzip() is None, 'ZIP integrity check failed'
                  archive.extractall(unpacked)
              candidates.append((unpacked / name, Path('qisheng-cli.exe')))
          else:
              with tarfile.open(packages / (name + '.tar.gz')) as archive:
                  archive.extractall(unpacked, filter='data')
              candidates.append((unpacked / name, Path('qisheng-cli')))
              extracted_deb = unpacked / 'deb'
              subprocess.run(['dpkg-deb', '--extract', str(debfile), str(extracted_deb)], check=True)
              candidates.append((extracted_deb / 'usr/lib/qisheng', Path('qisheng-cli')))
          verified = []
          for index, (directory, relative_cli) in enumerate(candidates):
              for line in (directory / 'SHA256SUMS.txt').read_text(encoding='utf-8').splitlines():
                  expected, relative = line.split('  ', 1)
                  checked = directory / relative
                  checked.resolve().relative_to(directory.resolve())
                  assert hashlib.sha256(checked.read_bytes()).hexdigest() == expected, relative
              result = subprocess.run([str(directory / relative_cli), '--data-dir', str(root / 'temp' / ('归档验证-' + str(index))), 'status'], capture_output=True, timeout=45)
              (root / 'evidence' / ('archive-cli-' + str(index) + '.log')).write_bytes(result.stdout + result.stderr)
              assert result.returncode == 0, result.stderr.decode(errors='replace')[-3000:]
              verified.append(dict(directory=directory.name, checksum='passed', cli='passed'))
          (root / 'evidence' / 'archive-verification.json').write_text(json.dumps(verified, indent=2), encoding='utf-8')
          (packages / 'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n' for path in sorted(packages.iterdir()) if path.is_file()), encoding='utf-8')
          PY

      - name: Validated packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Qisheng-${{ matrix.label }}-${{ github.sha }}
          path: ${{ runner.temp }}/qisheng-ci/packages/*
          if-no-files-found: error
          retention-days: 7

      - name: Test and native window evidence
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Evidence-${{ matrix.label }}-${{ github.sha }}
          path: ${{ runner.temp }}/qisheng-ci/evidence/*
          if-no-files-found: warn
          retention-days: 7

      - name: Measure reusable native cache
        if: always() && steps.prepare.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true'
        id: cache-size
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['CARGO_TARGET_DIR'])
          total = sum(path.stat().st_size for path in root.rglob('*') if path.is_file() and not path.is_symlink()) if root.exists() else 0
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('save=' + str(0 < total <= 8 * 1024**3).lower() + '\n')
          print('Native cache logical bytes:', total)
          PY

      - name: Save compatible native cache
        if: always() && steps.cache-size.outputs.save == 'true' && steps.native-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/qisheng-target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
