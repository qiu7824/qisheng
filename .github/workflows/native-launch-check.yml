name: Native desktop regression
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native desktop host
        type: choice
        options: [macos, linux, windows]
        default: macos
        required: true
permissions:
  contents: read
concurrency:
  group: native-launch-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  native-launch:
    runs-on: ${{ inputs.platform == 'windows' && 'windows-2025' || (inputs.platform == 'linux' && 'ubuntu-24.04' || 'macos-15') }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      QISHENG_BINARY_DIRECTORY: debug
      PYTHONUTF8: '1'
      QISHENG_NATIVE_TARGET: ${{ inputs.platform == 'windows' && 'x86_64-pc-windows-msvc' || (inputs.platform == 'linux' && 'x86_64-unknown-linux-gnu' || 'aarch64-apple-darwin') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Prepare native toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup override set 1.99.0
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/qisheng-target" >> "$GITHUB_ENV"
          echo "QISHENG_CI_ROOT=$RUNNER_TEMP/qisheng-native-regression" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/qisheng-native-regression/evidence" "$RUNNER_TEMP/qisheng-native-regression/temp"
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libasound2-dev libcairo2-dev libpango1.0-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxfixes-dev libegl1-mesa-dev libgl1-mesa-dev fonts-noto-cjk xvfb xauth dbus-x11 zenity openbox
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/qisheng-target
          key: qisheng-native-${{ env.QISHENG_NATIVE_TARGET }}-rust-1.99.0-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            qisheng-native-${{ env.QISHENG_NATIVE_TARGET }}-rust-1.99.0-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}
            qisheng-native-${{ env.QISHENG_NATIVE_TARGET }}-rust-1.99.0-
      - name: Native per-profile IPC
        id: ipc
        run: |
          set -o pipefail
          cargo test --locked --bin lx-native instance:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/native-launch.log"
      - name: Restored playback preferences
        run: |
          set -o pipefail
          cargo build --locked --profile test --bin lx-native-cli
          cargo test --locked --no-fail-fast --test backend_backup --test backend_native_restore -- --test-threads=1 2>&1 | tee "$QISHENG_CI_ROOT/evidence/restore-tests.log"
      - name: Build native interaction executable
        id: interaction_build
        if: ${{ !cancelled() && steps.ipc.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo build --locked --profile test --features smoke --bin lx-native 2>&1 | tee "$QISHENG_CI_ROOT/evidence/interaction-build.log"
      - name: Native window lifecycle and file panels
        if: ${{ !cancelled() && steps.interaction_build.outcome == 'success' }}
        run: python .github/scripts/native_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Native-launch-${{ inputs.platform }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-launch.log
            ${{ runner.temp }}/qisheng-native-regression/evidence/*
          retention-days: 7
          if-no-files-found: warn
